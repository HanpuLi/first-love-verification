name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System dependency
        run: ffmpeg -version | head -n 1
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and import smoke
        run: |
          python -m compileall -q scripts outputs tools tests
          for f in scripts/*.sh; do bash -n "$f"; done
          python - <<'PY'
          import cv2, librosa, numpy, scenedetect
          print("imports ok")
          PY
      - name: Media-free regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Repository and copyright boundary
        run: python tools/check_repository.py
