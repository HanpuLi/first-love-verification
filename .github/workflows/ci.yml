name: CI

on:
  push:
    branches: [main, publish/verification-analysis-20260925]
  pull_request:
    branches: [main, publish/verification-analysis-20260925]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Media-dependent boundary
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "ffmpeg is not installed on this CI runner; media-dependent analyses are intentionally not executed in CI."
          fi
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and import smoke
        run: |
          python -m compileall -q scripts outputs tools tests
          for f in scripts/*.sh; do bash -n "$f"; done
          python - <<'PY'
          import cv2, librosa, numpy, scenedetect, scipy
          print("imports ok")
          PY
      - name: Media-free regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Repository and copyright boundary
        run: python tools/check_repository.py
