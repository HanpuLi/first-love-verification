name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag/version guard
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: System dependency
        run: ffmpeg -version | head -n 1
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release snapshot
        run: |
          python -m compileall -q scripts outputs tools tests
          for f in scripts/*.sh; do bash -n "$f"; done
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/check_repository.py

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create source snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "First Love verification $GITHUB_REF_NAME"             --notes "Citable source/reproducibility snapshot. No copyrighted film, subtitles or extracted frames are included."
